# dsh-fish-jiyu —— 线性投影压缩引擎
#
# 引擎和编译器都在本包（lib/engine/、lib/compiler/，内核最初搬自 dsh-compaction-vcc，
# MIT，已由本包接管）。同一个 ctx.compaction 只能有一个实现，所以别的实现要先腾开。
#
# 生效方式：同一批生效里安好自己、关掉别的压缩引擎，中间别留空窗。
- id: compaction-fold
  disabled: true
# 宿主自带的基础压缩引擎：不关掉它会和本引擎抢同一个服务名
# （非 web profile 没有 dsh-web-app 那层兜底，撞名会直接抛）
- id: compaction-basic
  disabled: true
- insert:
  - id: compaction-jiyu
    name: 'dsh-fish-jiyu/engine'
    config:
      thresholdRatio: 0.35
      retainTurns: 1
      retainTokens: 16384
  # 暂缓工具单独一个 entry（和原来 vcc 的 tool-recall 一样）：宿主只给声明过的
  # 插件注入 tools，塞进引擎类里拿不到。删掉这一行 = 没有 jiyu_hold，
  # 引擎那半的暂缓判断仍能工作，只是没人能调。
  - id: jiyu-hold
    name: 'dsh-fish-jiyu/tool'
  # 压缩决策页的宿主半：两条只读路由（inspect.html / report.json），
  # 按钮在 client.js。删掉这一行 = 没有「压缩」那一格，引擎和工具都不受影响。
  - id: jiyu-view
    name: 'dsh-fish-jiyu/view'
